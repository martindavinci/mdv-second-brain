name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows is where the plugin is used most (8.3 temp paths, junctions, the Codex sandbox user); macOS has
    # /var → /private/var. Node 18 is the minimum in package.json engines.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Git identity
        # One test commits in a shared repo that has no identity of its own. Global, so repo identities still win.
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Tests
        # The runner image sets safe.directory=* in /etc/gitconfig, which would stop git refusing the repos of another
        # account, as the ownership tests expect.
        env:
          GIT_CONFIG_NOSYSTEM: 1
        run: npm test
